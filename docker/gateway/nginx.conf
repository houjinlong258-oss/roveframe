# ---------------------------------------------------------------------------
# RoveFrame AI Business OS — internal API gateway (self-hosted database)
#
# Why this container exists at all:
#   supabase-js builds EVERY path from ONE base URL
#   (`<url>/rest/v1/...`, `<url>/auth/v1/...`, `<url>/storage/v1/...`).
#   PostgREST, GoTrue and Storage API are three separate processes, so something
#   has to present them at a single origin. That is this file's only job.
#
# Boundary:
#   This service is NOT published to the host. `docker-compose.selfhosted.yml`
#   only `expose`s it on the internal network. The public entry point is Caddy,
#   and Caddy forwards exactly one storage prefix (/storage/v1/object/public/)
#   here. Therefore PostgREST and GoTrue are unreachable from the internet by
#   construction, not by an allow/deny rule that a later edit could undo.
#
#   This is strictly tighter than Supabase Cloud, where /rest/v1/ is always
#   public and only the anon key plus RLS stand between a stranger and your data.
# ---------------------------------------------------------------------------

worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  access_log /dev/stdout;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  # src/app/api/upload/route.ts accepts images <=5MB and videos <=50MB.
  client_max_body_size 64m;
  client_body_timeout  300s;

  # NOTE: `map` must be declared BEFORE the proxy_set_header lines that use
  # $connection_upgrade. nginx resolves variables while parsing the file, so
  # declaring this map after its first use fails with
  # "unknown \"connection_upgrade\" variable".
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_set_header Upgrade           $http_upgrade;
  proxy_set_header Connection        $connection_upgrade;

  # AI streaming calls are allowed 300s (STREAM_TIMEOUT_MS in src/lib/ai/transport).
  proxy_connect_timeout 15s;
  proxy_send_timeout    300s;
  proxy_read_timeout    300s;

  upstream roveframe_rest    { server rest:3000; }
  upstream roveframe_auth    { server auth:9999; }
  upstream roveframe_storage { server storage:5000; }

  server {
    listen 80;
    server_name _;

    # PostgREST. supabase-js requests /rest/v1/<table>; PostgREST serves at /.
    location /rest/v1/ {
      proxy_pass http://roveframe_rest/;
    }

    # GoTrue. supabase-js requests /auth/v1/token, /auth/v1/admin/users, ...
    location /auth/v1/ {
      proxy_pass http://roveframe_auth/;
    }

    # Storage API. supabase-js requests /storage/v1/object/..., /storage/v1/bucket.
    location /storage/v1/ {
      proxy_pass http://roveframe_storage/;
    }

    # Fail closed. An unmatched path must NOT fall through to anything: the only
    # caller of this gateway is the web container, and it only ever uses the
    # three prefixes above.
    location / {
      return 404;
    }
  }
}
